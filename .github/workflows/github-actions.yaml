name: Python package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  public-release:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test public release guard
        run: python -m unittest discover -s .github/scripts -p '*_test.py'
      - name: Check every incoming commit for withheld DRA source
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python .github/scripts/check_public_release.py --base "$BASE_REVISION" --head "$HEAD_REVISION"
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Sync project (needed by ty hook)
        run: uv sync --locked --python 3.12
      - uses: pre-commit/action@v3.0.1
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Restore JAX compilation cache
        uses: actions/cache@v4
        with:
          path: .jax_cache
          key: jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-${{ github.run_id }}
          restore-keys: |
            jax-cache-${{ runner.os }}-${{ hashFiles('uv.lock') }}-
      - name: Test with chex
        env:
          # LRU-evict entries for programs that no longer exist.
          JAX_COMPILATION_CACHE_MAX_SIZE: "1073741824"
        run: |
          # Serial: the 2-core, 7 GB runner is slower with two JAX workers.
          PYTHONPATH=. uv run pytest --cov xlron
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - name: Set up Python
        run: uv python install ${{ matrix.python-version }}
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: uv sync --python ${{ matrix.python-version }} --extra docs
      - name: Regenerate command-line options reference
        run: uv run --python ${{ matrix.python-version }} python docs/gen_flags_reference.py
      - run: uv run --python ${{ matrix.python-version }} mkdocs gh-deploy --force
